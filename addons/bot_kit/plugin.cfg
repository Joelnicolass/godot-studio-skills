[plugin]

name="BotKit"
description="Bots that play your character like a person, in 3D: a node that presses the keys a player presses (an Input-like object your character reads). It sees the nearest enemy with a clear line, turns and aims with a person's limits (reaction, error, a fire cone, bursts, leading and lobbing), picks the weapon that suits the distance, keeps its distance and steps sideways, and walks the navigation mesh to goals, to where it last saw an enemy or anywhere it can reach, jumping out when stuck. Your own behaviours as child nodes; difficulty presets. No network code, no autoload, no other kit."
author="godot-studio"
version="0.1.0"
script="plugin.gd"
