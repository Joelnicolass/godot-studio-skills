[plugin]

name="GridKit"
description="Boards of hexagons or squares as data (CellGrid, HexGrid, SquareGrid), a saveable map (GridLayout), nodes to show and pick them in 3D, fog of war per player (CellFog, GridFog), and a brush in the 3D view to paint the map. No game rules, no autoload."
author="godot-studio"
version="0.8.0"
script="plugin.gd"
