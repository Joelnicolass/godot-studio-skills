[plugin]

name="GestureKit"
description="Touch gestures Godot does not bring: taps with one or more fingers, double tap, long press, swipe, drag, pinch and twist, read by a GestureArea (a Control) or a GestureReader you feed. The mouse is a finger too, Alt + drag is two. No autoload."
author="godot-studio"
version="0.1.0"
script="plugin.gd"
