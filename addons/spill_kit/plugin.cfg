[plugin]

name="SpillKit"
description="What a body spills, in 3D: blood, ichor, oil, slime, ink. Each hit sprays drops and leaves marks on the floor; a death grows a puddle. Each substance is a type with its own PBR look (albedo, normal, ORM) or your game's material. One synced value for a network game; Compatibility and WebGL 2; nothing drawn on a dedicated server. No network code, no autoload, no other kit."
author="godot-studio"
version="0.2.1"
script="plugin.gd"
